version: "3.9"

services:
  web:
    build:
      dockerfile: docker/web.Dockerfile
      target: dev
    volumes:
      - ../web:/app
      - /app/node_modules
    command: npm run dev
    ports: ["3000:3000"]

  api:
    build:
      dockerfile: docker/api.Dockerfile
      target: dev
    volumes:
      - ../src:/app/src
    command: uvicorn src.api.main:app --reload --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
