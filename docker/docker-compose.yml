version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports: ["3000:3000"]
    env_file: ../web/.env.local
    depends_on: [api]
    networks: [mission-net]

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports: ["8000:8000"]
    environment:
      - MCP_GITHUB_URL=http://mcp-github:8001
      - MCP_STORAGE_URL=http://mcp-storage:8002
      - MCP_ONCHAIN_URL=http://mcp-onchain:8003
      - MCP_TELEMETRY_URL=http://mcp-telemetry:8004
      - QDRANT_URL=http://qdrant:6333
      - TRINO_HOST=trino
      - POLARIS_URI=http://polaris:8181
      - OLLAMA_URL=http://ollama:11434
      - PHOENIX_ENDPOINT=http://phoenix:6006
    depends_on:
      mcp-github: { condition: service_started }
      mcp-storage: { condition: service_started }
      mcp-onchain: { condition: service_started }
      mcp-telemetry: { condition: service_started }
      qdrant: { condition: service_started }
    networks: [mission-net]

  mcp-github:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports: ["8001:8001"]
    command: python -m src.mcp.github_server
    networks: [mission-net]

  mcp-storage:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports: ["8002:8002"]
    command: python -m src.mcp.storage_server
    networks: [mission-net]

  mcp-onchain:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports: ["8003:8003"]
    command: python -m src.mcp.onchain_server
    networks: [mission-net]

  mcp-telemetry:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports: ["8004:8004"]
    command: python -m src.mcp.telemetry_server
    networks: [mission-net]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant-data:/qdrant/storage]
    networks: [mission-net]

  trino:
    image: trinodb/trino:latest
    ports: ["8080:8080"]
    volumes: [./config/trino:/etc/trino]
    networks: [mission-net]

  polaris:
    image: apache/polaris:latest
    ports: ["8181:8181"]
    environment:
      - POLARIS_BOOTSTRAP_CREDENTIALS=admin:admin
    networks: [mission-net]

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ports: ["6379:6379"]
    volumes: [dragonfly-data:/data]
    networks: [mission-net]

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]
    networks: [mission-net]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]
    networks: [mission-net]

volumes:
  qdrant-data:
  dragonfly-data:
  ollama-data:

networks:
  mission-net:
    driver: bridge
